<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E9CA7C" />
      <stop offset="28%" stopColor="#F9EDCE" />
      <stop offset="65%" stopColor="#D4A347" />
      <stop offset="100%" stopColor="#BD8B2E" />
