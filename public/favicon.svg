<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sbgGold" x1="80" y1="60" x2="432" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E7CD82" />
      <stop offset="30%" stopColor="#F8ECCB" />
      <stop offset="65%" stopColor="#D6A648" />
      <stop offset="100%" stopColor="#BA872C" />
    </linearGradient>
  </defs>

  <!-- Single Outer Gold Ring -->
